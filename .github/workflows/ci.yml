name: CI

on:
  push:
    branches: [6.X-Vue]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 门禁：lint + 构建。typecheck（vue-tsc）尚未纳入门禁——
      # S23 记录"未跑 vue-tsc"，基线未验证前不设卡点，避免把已有报错当成本次回归。
      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
