<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Stack Depth 品牌标：错位叠框（Stack）+ 前框品牌黄（Depth）。
       与 blog-web AppBrand.vue 同源；favicon 场景无 CSS 变量可用，
       故用 SVG 内置 <style> + prefers-color-scheme 实现深浅自适应（浅=近黑后框 / 深=米色后框）。
       不加发光：16px 尺寸下 drop-shadow 会糊。 -->
  <style>
    .mark-back { stroke: #211e1c; }
    .mark-front { stroke: #ffd500; }
    @media (prefers-color-scheme: dark) {
      .mark-back { stroke: #f4f1ea; }
    }
  </style>
  <rect class="mark-back" x="6" y="10" width="22" height="22" rx="6" stroke-width="2.6" />
  <rect class="mark-front" x="12" y="6" width="22" height="22" rx="6" stroke-width="2.6" />
</svg>
