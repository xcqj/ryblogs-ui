# =============================================================================
# 后台管理 nginx 配置（S25）
#
# 两个契约点，改动前务必看：
#   1. VITE_APP_BASE_API = '/prod-api'（.env.production）→ 下面的 location /prod-api/
#      proxy_pass 尾部**必须带斜杠**：它会把 /prod-api 前缀剥掉再转给后端；
#      少了斜杠，后端收到 /prod-api/system/... 会 404。
#   2. VITE_APP_MESSAGE_TRANSPORT = 'sse' → 统一消息推送走长连接，必须关掉 proxy_buffering，
#      否则事件被缓冲、前端收不到实时消息。
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 构建时 VITE_BUILD_COMPRESS=gzip 已产出 .gz，直接发预压缩文件
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 单页应用路由（history 模式）----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端反代 ----------
    # 用 resolver + 变量而非直接写 proxy_pass http://backend:8081/
    # 原因：nginx 只在**启动时**解析一次 upstream 主机名——① 后端还没起来时 nginx 直接
    # [emerg] host not found 退出（实测踩过）；② 后端容器重启换了 IP，nginx 会一直指向旧 IP，
    # 表现为长期 502。变量形式让 nginx 在每次请求时按 resolver 重新解析。
    # 127.0.0.11 是 Docker 自定义网络的内置 DNS。
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /prod-api/ {
        # ⚠️ set 必须在 rewrite 之前：nginx 的 rewrite 模块按书写顺序执行，
        # `rewrite ... break` 会终止后续 rewrite 阶段指令（含 set），
        # 表现为 "using uninitialized backend_upstream variable" + 500。
        set $backend_upstream http://backend:8081;
        # 变量形式的 proxy_pass 不再自动处理 URI，必须自己剥掉 /prod-api 前缀
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（/prod-api/resource/message）：不缓冲、长超时
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        # 上传大图（文章封面/正文插图）时不要卡在 1MB 默认限制
        client_max_body_size 50m;
    }

    # ---------- 静态资源长缓存 ----------
    # index.html 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 健康检查（compose healthcheck 用）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
